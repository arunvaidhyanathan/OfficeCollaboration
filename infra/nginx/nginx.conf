# POC nginx config: serves the built frontend and proxies /api/ to Document Core.
#
# ONLYOFFICE Document Server is NOT proxied through here for the POC -- the browser talks to it
# directly at its own published port (see VITE_ONLYOFFICE_URL in frontend/.env, default
# http://localhost:8082). When this goes past POC and you want everything behind one origin (the
# shape in docs/architecture/office-collaboration-architecture.html), add a location block here for
# ONLYOFFICE's path with the WebSocket upgrade headers below, matching what the ADR's nginx section
# describes.

server {
    listen 80;
    server_name _;

    # Office files can be tens of MB; raise the default 1m limit.
    client_max_body_size 50m;

    # Long-lived requests (large uploads, slow S3 round-trips) shouldn't time out at nginx's default.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /api/ {
        proxy_pass http://document-core:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
